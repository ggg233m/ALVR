[package]
name = "alvr_server_openvr"
version.workspace = true
edition.workspace = true
authors = ["alvr-org", "Valve Corporation"]
license = "MIT"

[lib]
crate-type = ["cdylib"]

[features]
gpl = [] # Enable for FFmpeg support on Windows. Always enabled on Linux

[dependencies]
alvr_common.workspace = true
alvr_filesystem.workspace = true
alvr_packets.workspace = true
alvr_server_core.workspace = true
alvr_server_io.workspace = true
alvr_session.workspace = true

serde_json = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
# spin_sleep was tested and removed: an accurate sleep made cycle_avg worse
# (11.14 -> 11.27 ms) because SteamVR's callback gap absorbs whatever the sleep
# gives back. See the note in src/lib.rs wait_for_vsync.

[build-dependencies]
alvr_filesystem = { path = "../filesystem" }
bindgen = "0.72"
cc = { version = "1", features = ["parallel"] }
walkdir = "2"

[target.'cfg(target_os = "linux")'.build-dependencies]
pkg-config = "0.3"
